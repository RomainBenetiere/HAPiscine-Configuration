# Part of raspipool project @ github (by segalion at gmail)

# Relais de puissance : voir waveshare.yaml (carte Waveshare Modbus TCP).
# Les anciennes sorties GPIO (27 pompe, 17 robot, 21 pH, 16 électrolyseur, 20 Javel)
# ne sont plus utilisées. Mapping actuel : CH1 pompe, CH2 robot, CH3 pH,
# CH4 électrolyseur, CH5 Javel.

input_boolean:
  lock_bleach:
    name: "Verrouillage électrolyseur"
    initial: false
    icon: mdi:lock
  lock_muriatic:
    initial: false
    icon: mdi:lock
  lock_javel:
    name: "Verrouillage pompe Javel"
    initial: false
    icon: mdi:lock


# entity_id doit rester binary_sensor.bleach (dérivé du name). Renommer en "Électrolyseur" dans Paramètres > Entités si besoin.
template:
  - binary_sensor:
      - name: "Bleach"
        unique_id: raspipool_bleach
        device_class: plug
        state: "{{ is_state('switch.electrolyseur', 'on') }}"
        icon: >-
          {% if is_state('input_boolean.lock_bleach', 'on') %}
            mdi:lock
          {% else %}
            mdi:lightning-bolt
          {% endif %}
      - name: "Muriatic"
        unique_id: raspipool_muriatic
        device_class: plug
        state: "{{ is_state('switch.ph', 'on') }}"
        icon: >-
          {% if is_state('input_boolean.lock_muriatic', 'on') %}
            mdi:lock
          {% else %}
            mdi:power-plug
          {% endif %}
      - name: "Javel"
        unique_id: raspipool_javel
        device_class: plug
        state: "{{ is_state('switch.javel', 'on') }}"
        icon: >-
          {% if is_state('input_boolean.lock_javel', 'on') %}
            mdi:lock
          {% else %}
            mdi:bottle-tonic
          {% endif %}

binary_sensor:
  - platform: rpi_gpio
    ports:
      23: FlowD HW
    invert_logic: true
    pull_mode: "UP"

